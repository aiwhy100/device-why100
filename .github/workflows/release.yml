# 打 v* 标签时：编译固件，合并成一个可以直接刷的 .bin，附到 Release；同时更新网页刷机页（GitHub Pages）
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware/esp32s3-audio-board
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o ../why100-esp32s3-audio-board.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/esp32s3-audio-board/why100-esp32s3-audio-board.bin
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/esp32s3-audio-board/why100-esp32s3-audio-board.bin

  pages:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web-flasher
      - name: 写入版本号
        run: sed -i "s/__VERSION__/${GITHUB_REF_NAME}/" web-flasher/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - uses: actions/deploy-pages@v4
